[package]
name = "rusty-fem"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Educational finite element method solver written in Rust."
license = "MIT"

[lib]
name = "rusty_fem"
path = "src/lib.rs"

[[bin]]
name = "rusty-fem"
path = "src/main.rs"

[[bench]]
name = "solver_benchmark"
harness = false

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
nalgebra = "0.35.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
